name: Release macOS Packages

on:
  workflow_call:
    inputs:
      version:
        description: Release version
        required: true
        type: string

jobs:
  macos-disabled:
    name: macOS packages are not built by this fork
    runs-on: ubuntu-latest
    steps:
      - name: Refuse macOS packaging
        run: |
          echo "This fork only publishes Windows ROCm (gfx1103)." >&2
          exit 1
